name: VNext Pull Request Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "lib/editor/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/vnext-checks.yml"

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run source and UI regression tests
        run: node --test tests/*.test.mjs
      - name: Build GitHub Pages version
        run: npm run build:pages
